[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "funbrowser"
version = "0.0.1"
description = "Undetect browser with built-in captcha solving via funsolver.com"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "FunBrowser contributors" }]
keywords = ["browser", "automation", "captcha", "cdp", "stealth", "antibot", "funsolver"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/WhyY0u/funBrowser"
Issues = "https://github.com/WhyY0u/funBrowser/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["funbrowser"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
]
ignore = [
    # `timeout` is a natural public-API parameter; we expose it deliberately
    # instead of forcing callers to wrap with asyncio.timeout(). The rule is
    # too strict for SDK surfaces.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# Demo scripts hit the disk synchronously by design — async-file purity here
# would obscure the point of the example.
"examples/**" = ["ASYNC230", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
