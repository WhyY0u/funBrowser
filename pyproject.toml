[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "funbrowser"
version = "0.1.26"
description = "Undetect browser SDK for Python with built-in captcha solving via funsolver.com"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "FunBrowser contributors" }]
keywords = [
    "browser",
    "undetect",
    "undetected",
    "anti-detect",
    "antidetect",
    "stealth",
    "stealth-browser",
    "headless",
    "headless-chrome",
    "chrome",
    "cdp",
    "chrome-devtools-protocol",
    "automation",
    "browser-automation",
    "web-scraping",
    "scraping",
    "captcha",
    "captcha-solver",
    "captcha-bypass",
    "recaptcha",
    "hcaptcha",
    "turnstile",
    "funcaptcha",
    "geetest",
    "cloudflare",
    "cloudflare-bypass",
    "antibot",
    "anti-bot",
    "bot-detection",
    "fingerprint",
    "fingerprint-spoofing",
    "proxy",
    "funsolver",
    "async",
    "asyncio",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local web panel for pool management. Install with: pip install funbrowser[panel]
panel = ["aiohttp>=3.9"]
# TLS fingerprint impersonation via curl_cffi + CA cert lifecycle via
# cryptography. Install with: pip install funbrowser[tls]
tls = [
    "curl_cffi>=0.7",
    "cryptography>=42",
]
# TOTP code generation for site logins with 2FA. Install with:
# pip install funbrowser[automation]
automation = [
    "pyotp>=2.9",
]

[project.urls]
Homepage = "https://github.com/WhyY0u/funBrowser"
Documentation = "https://github.com/WhyY0u/funBrowser#readme"
Repository = "https://github.com/WhyY0u/funBrowser"
Issues = "https://github.com/WhyY0u/funBrowser/issues"
Changelog = "https://github.com/WhyY0u/funBrowser/blob/main/CHANGELOG.md"
"FunSolver API" = "https://funsolver.com"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    # optional extras pulled in for tests too
    "aiohttp>=3.9",
    "curl_cffi>=0.7",
    "cryptography>=42",
    "pyotp>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["funbrowser"]

[tool.hatch.build]
# Hatchling defaults pick up *.py only — we ship JS patches in
# funbrowser/stealth/scripts/ and funbrowser/solver/scripts/, so list
# them explicitly. force-include caused double-inclusion of __init__.py.
include = [
    "funbrowser/**/*.py",
    "funbrowser/**/*.js",
    "funbrowser/py.typed",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
]
ignore = [
    # `timeout` is a natural public-API parameter; we expose it deliberately
    # instead of forcing callers to wrap with asyncio.timeout(). The rule is
    # too strict for SDK surfaces.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# Demo scripts hit the disk synchronously by design — async-file purity here
# would obscure the point of the example.
"examples/**" = ["ASYNC230", "ASYNC240"]
# panel.py embeds a long HTML string; ambiguous Unicode glyphs (× ⚫ ⚙ etc.)
# are intentional UI elements, and Python line-length rules don't apply to
# embedded HTML/CSS/JS.
"funbrowser/panel.py" = ["E501", "RUF001"]
# mitm.py writes ephemeral cert files for ssl.load_cert_chain — that API
# takes filenames, not bytes. Path.unlink under async is a deliberate
# choice, not an oversight.
"funbrowser/tls/mitm.py" = ["ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
